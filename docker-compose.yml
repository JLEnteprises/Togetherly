services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: togetherly
      POSTGRES_USER: togetherly
      POSTGRES_PASSWORD: togetherly
    ports:
      - "5432:5432"
    volumes:
      - togetherly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U togetherly -d togetherly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  togetherly_postgres:
