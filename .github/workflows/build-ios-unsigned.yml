name: Build Togetherly unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Togetherly API URL embedded in the app"
        required: true
        default: "http://192.168.1.16:4000"
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Show toolchain
        run: |
          node --version
          npm --version
          xcodebuild -version
          ruby --version
          pod --version
          echo "API URL: $EXPO_PUBLIC_API_URL"

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned device app and package IPA
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          APP_PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' ! -name 'Pods.xcodeproj' -print -quit)"

          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found under ios/."
            exit 1
          fi
          if [ -z "$APP_PROJECT" ]; then
            echo "No application Xcode project found under ios/."
            exit 1
          fi

          PROJECT_NAME="$(basename "$APP_PROJECT" .xcodeproj)"
          SCHEME="$(xcodebuild -list -project "$APP_PROJECT" -json | python3 -c 'import json,sys; name=sys.argv[1]; d=json.load(sys.stdin); schemes=d.get("project",{}).get("schemes",[]); print(name if name in schemes else (schemes[0] if schemes else ""))' "$PROJECT_NAME")"

          if [ -z "$SCHEME" ]; then
            echo "No application Xcode scheme found."
            xcodebuild -list -project "$APP_PROJECT"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Application project: $APP_PROJECT"
          echo "Application scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          PRODUCTS="$PWD/ios/build/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS" -maxdepth 2 -type d -name "${SCHEME}.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find "$PRODUCTS" -maxdepth 2 -type d -name '*.app' -print -quit)"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Xcode succeeded but no application bundle was found. Products were:"
            find "$PRODUCTS" -maxdepth 2 -print || true
            exit 1
          fi

          echo "Application bundle: $APP_PATH"

          rm -rf ipa-output
          mkdir -p ipa-output/Payload
          cp -R "$APP_PATH" ipa-output/Payload/

          (
            cd ipa-output
            /usr/bin/zip -qry "Togetherly-v1.11-unsigned.ipa" Payload
          )

          test -s ipa-output/Togetherly-v1.11-unsigned.ipa
          echo "IPA created: ipa-output/Togetherly-v1.11-unsigned.ipa"
          ls -lh ipa-output/Togetherly-v1.11-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Togetherly-v1.11-unsigned-IPA
          path: ipa-output/Togetherly-v1.11-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
