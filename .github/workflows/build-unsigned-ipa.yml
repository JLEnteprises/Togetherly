name: Build Togetherly unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Togetherly API URL to embed (leave blank to use repo variable TOGETHERLY_API_URL)'
        required: false
        type: string
      eas_project_id:
        description: 'Expo/EAS project UUID for Expo Push (leave blank to use TOGETHERLY_EAS_PROJECT_ID)'
        required: false
        type: string
      bundle_id:
        description: 'iOS bundle identifier'
        required: false
        default: 'com.jlenteprises.togetherly'
        type: string
      apple_team_id:
        description: '10-character Team ID used only to generate Xcode targets; 0000000000 is fine for an unsigned build'
        required: false
        default: '0000000000'
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone + Watch IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      INPUT_API_URL: ${{ inputs.api_url }}
      VAR_API_URL: ${{ vars.TOGETHERLY_API_URL }}
      INPUT_EAS_PROJECT_ID: ${{ inputs.eas_project_id }}
      VAR_EAS_PROJECT_ID: ${{ vars.TOGETHERLY_EAS_PROJECT_ID }}
      INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}
      VAR_BUNDLE_ID: ${{ vars.TOGETHERLY_BUNDLE_ID }}
      INPUT_APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
      VAR_APPLE_TEAM_ID: ${{ vars.TOGETHERLY_APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Configure build values
        shell: bash
        run: |
          set -euo pipefail
          API_URL="${INPUT_API_URL:-${VAR_API_URL:-}}"
          EAS_ID="${INPUT_EAS_PROJECT_ID:-${VAR_EAS_PROJECT_ID:-}}"
          BUNDLE_ID="${INPUT_BUNDLE_ID:-${VAR_BUNDLE_ID:-com.jlenteprises.togetherly}}"
          TEAM_ID="${INPUT_APPLE_TEAM_ID:-${VAR_APPLE_TEAM_ID:-0000000000}}"

          if [[ -z "$API_URL" ]]; then
            echo '::error::No API URL supplied. Enter api_url when running the workflow or create repository variable TOGETHERLY_API_URL.'
            exit 1
          fi
          if [[ ! "$API_URL" =~ ^https?:// ]]; then
            echo '::error::API URL must start with http:// or https://'
            exit 1
          fi
          if [[ ! "$TEAM_ID" =~ ^[A-Za-z0-9]{10}$ ]]; then
            echo '::error::apple_team_id must be exactly 10 letters/numbers. For unsigned builds you may use 0000000000.'
            exit 1
          fi

          echo "EXPO_PUBLIC_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_EAS_PROJECT_ID=$EAS_ID" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_IOS_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "TOGETHERLY_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_ANDROID_PACKAGE=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

          echo "Building bundle: $BUNDLE_ID"
          echo "Embedding API: $API_URL"
          if [[ -z "$EAS_ID" ]]; then
            echo '::warning::No EAS project UUID supplied. The IPA can build, but Expo Push token registration will report that push is not configured.'
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Client typecheck
        run: npm run typecheck

      - name: Install CocoaPods 1.16.2
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Show tool versions
        run: |
          node --version
          npm --version
          xcodebuild -version
          swift --version
          ruby --version
          pod --version

      - name: Verify Swift 6.2+
        shell: bash
        run: |
          set -euo pipefail
          SWIFT_VERSION="$(swift --version | head -n1)"
          echo "$SWIFT_VERSION"
          if [[ ! "$SWIFT_VERSION" =~ Swift\ version\ (6\.[2-9]|[7-9]\.) ]]; then
            echo '::error::Togetherly/ExpoModulesJSI requires Swift tools 6.2 or newer.'
            exit 1
          fi

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --clean --no-install

      - name: Install iOS pods
        working-directory: ios
        run: pod install --repo-update

      - name: Repair Watch target platform settings
        run: ruby .github/scripts/fix-watch-target-platform.rb

      - name: Build unsigned IPAs
        run: bash .github/scripts/build-unsigned-ipa.sh

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Togetherly-${{ github.run_number }}-xcode-diagnostics
          path: |
            output/xcodebuild.log
            output/xcode-schemes.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Togetherly-${{ github.run_number }}-unsigned-IPAs
          path: |
            output/*.ipa
            output/build-info.txt
          if-no-files-found: error
          retention-days: 14
