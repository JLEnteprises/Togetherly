name: Togetherly experience checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run typecheck
      - run: npm --prefix server run typecheck
      - run: npm --prefix server run logic
      - run: npm --prefix server run test:experience
      - run: npx expo export --platform web --output-dir /tmp/togetherly-web --max-workers 2
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
