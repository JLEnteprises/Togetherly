name: Togetherly validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and logic
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install client dependencies
        run: npm install --no-audit --no-fund

      - name: Client typecheck
        run: npm run typecheck

      - name: Install backend dependencies
        run: npm --prefix server ci --no-audit --no-fund

      - name: Server typecheck
        run: npm --prefix server run typecheck

      - name: Pure logic smoke tests
        run: npm --prefix server run logic
